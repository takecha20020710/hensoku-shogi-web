services:
  - type: web
    name: hensoku-shogi-ai-public
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: OPENING_ADMIN_PASSWORD
        sync: false
      - key: OPENING_BOOK_GITHUB_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: YANEURAOU_PATH
        value: /opt/yaneuraou/YaneuraOu
      - key: VARIANT_PAWN_EVAL
        value: "true"
      - key: VARIANT_ATTACK_EVAL
        value: "true"
      - key: VARIANT_HOME_ATTACK_EVAL
        value: "true"
